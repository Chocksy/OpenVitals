services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-openvitals}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/simple/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openvitals}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-google/gemini-3.7-flash}
      AI_OCR_MODEL: ${AI_OCR_MODEL:-google/gemini-2.5-flash}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Optional: raises the Semantic Scholar rate limit for hkb:research.
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      UPLOAD_DIR: /app/data/uploads
      NODE_ENV: production
    volumes:
      # lib/uploads.ts:writeUpload writes the PDF to disk, so this has to
      # outlive the container.
      - simple_uploads:/app/data/uploads
      # The legacy artefacts apps/web wrote, on the same volume name
      # docker-compose.prod.yml uses. import-legacy copies their `blob_path`
      # onto the uploads rows and lib/uploads.ts:localPath only serves the
      # file when this machine has it. Read-only: simple never writes here.
      - blobdata:/data/blobs:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # better-auth mounts GET /ok under the /api/auth catch-all.
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/auth/ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  pgdata:
  blobdata:
  simple_uploads:
